[project]
name = "lungo"
version = "0.1.0"
description = ""
authors = [{ name = "Shridhar Shah", email = "shridhsh@cisco.com" }]
requires-python = ">=3.13,<4.0"
dependencies = [
    "a2a-sdk==0.3.2",
    "click>=8.1.8",
    "coloredlogs>=15.0.1",
    "fastapi>=0.133.0,<1",
    "httpx>=0.23.0",
    "langchain-openai>=1.1.14,<2",
    "langgraph>=1.0.10,<2",
    "pydantic>=2.11.4",
    "python-dotenv>=1.2.2,<2",
    "requests>=2.33.0,<3",
    "starlette>=1.3.1,<2",
    "uvicorn>=0.29.0",
    "ioa-observe-sdk==1.0.24",
    "agntcy-identity-service-sdk==0.0.7",
    "langchain>=1.3.9,<2",
    "langchain-litellm>=0.3.0",
    "llama-index-core==0.14.9",
    "litellm==1.102.1",
    "agntcy-app-sdk==0.4.6",

    # Patched minimums; uv.lock fixes the tested transitive versions.
    "langchain-core>=1.3.3,<2",
    "urllib3>=2.7.0,<3",
    "aiohttp>=3.14.3,<4",
    "pyasn1>=0.6.4",
    "pypdf>=6.16.1",
    "filelock>=3.20.3",
    "marshmallow>=3.26.2",
    "PyNaCl>=1.6.2",
    "mcp>=1.28.1,<2",

    "cryptography>=50.0.0",
    "protobuf>=6.33.5,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "typing-extensions>=4.12.2,<5",
    "openai>=2.8.0,<3.0",
    "coloredlogs>=15.0.1,<16",
    "langchain-openai>=1.1.14,<2",
    "sentence-transformers>=5.1.1",
    "agntcy-oasf-sdk-grpc-python==1.75.0.1.20250917120021+8b2bf93bf8dc",
    "agntcy-oasf-sdk-protocolbuffers-python==33.5.0.1.20250917120021+8b2bf93bf8dc",
    "agntcy-dir>=0.6.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
ci = [
    "ruff==0.16.9",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pip-audit==2.10.1",
]

[tool.ruff]
target-version = "py313"
extend-exclude = ["tests/integration", "frontend", ".runtime"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[[tool.uv.index]]
url = "https://buf.build/gen/python"

[tool.poetry]
package-mode = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "common", "config", "services"]
