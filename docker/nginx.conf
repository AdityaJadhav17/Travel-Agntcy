server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;
    location /api/ {
        proxy_pass http://travel-supervisor:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
