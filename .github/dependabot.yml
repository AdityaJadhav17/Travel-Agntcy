version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react-runtime:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite-toolchain:
        patterns: ["vite", "@vitejs/plugin-react"]
      typescript-toolchain:
        # The native compiler and ESLint's compatibility API must stay paired.
        patterns: ["typescript", "@typescript/native", "@typescript-eslint/*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Keep the production runtime on the validated Python 3.13 release.
      # Check SDK native bindings and full CI before raising the minor version.
      - dependency-name: python
        versions: [">=3.14"]
