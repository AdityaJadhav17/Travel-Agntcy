version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # agntcy-app-sdk 0.4.6 pins slim-bindings 0.6.3 / PyO3 0.24.2,
      # which cannot build on Python 3.14. Revisit with an SDK upgrade.
      - dependency-name: python
        versions: [">=3.14"]
