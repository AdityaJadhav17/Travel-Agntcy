# Create this Secret separately; do not put credentials in Helm values.
existingSecret: travel-agntcy-env
imagePullPolicy: IfNotPresent
imagePullSecrets: []
nats:
  image: nats:2.11-alpine
service:
  type: ClusterIP
apps:
  flight-agent:
    image: flight-agent:latest
    port: 9001
    healthPath: /.well-known/agent.json
    env:
      FLIGHT_AGENT_HOST: "0.0.0.0"
      FLIGHT_AGENT_PORT: "9001"
  hotel-agent:
    image: hotel-agent:latest
    port: 9002
    healthPath: /.well-known/agent.json
    env:
      HOTEL_AGENT_HOST: "0.0.0.0"
      HOTEL_AGENT_PORT: "9002"
  activity-agent:
    image: activity-agent:latest
    port: 9003
    healthPath: /.well-known/agent.json
    env:
      ACTIVITY_AGENT_HOST: "0.0.0.0"
      ACTIVITY_AGENT_PORT: "9003"
  travel-supervisor:
    image: travel-supervisor:latest
    port: 8000
    nodePort: 30080
    healthPath: /health
    env: {}
  ui:
    image: lungo-ui:latest
    port: 3000
    nodePort: 30083
    healthPath: /
    env: {}
