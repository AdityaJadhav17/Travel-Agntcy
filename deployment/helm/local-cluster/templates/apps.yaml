{{- range $name, $app := .Values.apps }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/name: {{ $name }}
    spec:
      automountServiceAccountToken: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if ne $name "ui" }}
      initContainers:
        - name: wait-for-nats
          image: {{ $app.image | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          command:
            - /app/.venv/bin/python
            - -c
            - |
              import socket, time
              while True:
                  try:
                      with socket.create_connection(('nats', 4222), timeout=3):
                          break
                  except OSError:
                      time.sleep(2)
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ $app.image | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $app.port }}
          {{- if ne $name "ui" }}
          envFrom:
            - secretRef:
                name: {{ required "existingSecret is required" $.Values.existingSecret | quote }}
          env:
            - name: DEFAULT_MESSAGE_TRANSPORT
              value: NATS
            - name: TRANSPORT_SERVER_ENDPOINT
              value: nats://nats:4222
            - name: TRACING_ENABLED
              value: "false"
            - name: IDENTITY_AUTH_ENABLED
              value: "false"
            - name: ENABLE_HTTP
              value: "true"
            {{- range $key, $value := $app.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          startupProbe:
            httpGet:
              path: {{ $app.healthPath }}
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: {{ $app.healthPath }}
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ $app.healthPath }}
              port: http
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: {{ if $app.nodePort }}{{ $.Values.service.type }}{{ else }}ClusterIP{{ end }}
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $app.port }}
      targetPort: http
      {{- if and $app.nodePort (eq $.Values.service.type "NodePort") }}
      nodePort: {{ $app.nodePort }}
      {{- end }}
{{- end }}
