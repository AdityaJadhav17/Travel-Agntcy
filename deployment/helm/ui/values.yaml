# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

appName: lungo-ui
appVersion: v1
replicaCount: 1

environment:

image:
  repository: lungo-ui
  tag: latest
  pullPolicy: IfNotPresent
  pullSecret:

service:
  port: 3000

# VITE_* URLs are compiled into the image. Rebuild to change them.

# You can use your own config here for service account
serviceaccount:
  annotations:
    {}

# You can use your own ingress stack of operators and letsencrypt mechanism
ingress:
  enabled: false # If set to true, configure the values below for your ingress setup
  name: ""
  className: ""
  host: ""
  serviceName: ""
  servicePort: ""
  tlsSecret: ""
  annotations: {}

  extraIngresses:
    - name: ""
      enabled: false  # If set to true, configure the values below for the additional ingresses setup
      paths:
        - path: ""
          pathType: ""
      host: ""
      className: ""
      serviceName: ""
      servicePort: ""
      tlsSecret: ""
      annotations: {}

probes:
  livenessProbeEnabled: true
  readinessProbeEnabled: true
  port: 3000
  endpoint: /

resources:
  enabled: false
  limits:
    cpu: 2000m
    memory: 2500Mi
  requests:
    cpu: 200m
    memory: 500Mi
